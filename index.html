<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="恋愛や人間関係で、いつも同じところで苦しくなる。その「同じところ」に名前をつける10問3分の診断。">
<meta property="og:title" content="こじらせ16タイプ診断">
<meta property="og:description" content="いつも同じところで苦しくなる理由に、名前をつけます。10問・3分・登録不要。">
<meta property="og:type" content="website">
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>こじらせ16タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FFF7F0;
    --card:#FFFFFF;
    --soft:#FFF0E6;
    --line:#F2E2D5;
    --text:#3B3340;
    --dim:#7C7085;
    --faint:#A99CB0;

    /* 4グループの色 */
    --g-hold-give:#FF8BA0;   /* 抱×合 コーラル */
    --g-hold-keep:#A78BFA;   /* 抱×守 パープル */
    --g-free-give:#4FCBA4;   /* 放×合 ミント   */
    --g-free-keep:#5BB3F0;   /* 放×守 スカイ   */
    --accent:var(--g-hold-give);
    --accent-soft:#FFE6EB;

    --r:22px;
    --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
    --shadow:0 2px 0 rgba(59,51,64,.06), 0 10px 24px -14px rgba(59,51,64,.28);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#221C26;--card:#2E2632;--soft:#372D3C;--line:#443A49;
      --text:#F6EFF3;--dim:#C3B4C8;--faint:#9A8CA0;--accent-soft:#4A2E3A;
      --shadow:0 2px 0 rgba(0,0,0,.2), 0 10px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#221C26;--card:#2E2632;--soft:#372D3C;--line:#443A49;
    --text:#F6EFF3;--dim:#C3B4C8;--faint:#9A8CA0;--accent-soft:#4A2E3A;
    --shadow:0 2px 0 rgba(0,0,0,.2), 0 10px 24px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:16px;line-height:1.9;
    -webkit-font-smoothing:antialiased;
    padding-inline:18px;padding-block:0;
  }
  .wrap{max-width:540px;margin:0 auto}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .start:focus-visible,.opt:focus-visible,.ghost:focus-visible,.back:focus-visible{
    outline:3px solid var(--g-free-keep);outline-offset:3px;
  }

  /* ── 導入 ── */
  .intro{padding-block:34px 44px;text-align:center}
  .hero{
    width:min(240px,62vw);aspect-ratio:1/1;margin:0 auto 6px;
    border-radius:50%;background:var(--soft);overflow:hidden;
  }
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .pill{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:12px;letter-spacing:.08em;
    padding:6px 14px;border-radius:999px;margin-bottom:14px;
  }
  h1{
    font-weight:700;font-size:clamp(27px,7.4vw,35px);line-height:1.5;
    margin:0 0 18px;text-wrap:balance;
  }
  .lede{
    font-size:15px;color:var(--dim);margin:0 auto 26px;
    max-width:23em;text-align:left;
  }
  .lede b{color:var(--text);font-weight:700}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .chip{
    background:var(--card);border:2px solid var(--line);border-radius:999px;
    padding:7px 15px;font-size:13px;color:var(--dim);font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--text);font-weight:700}
  .start{
    display:block;width:100%;padding:19px;border:0;border-radius:999px;
    background:var(--accent);color:#fff;font-weight:700;font-size:17px;
    box-shadow:0 4px 0 rgba(0,0,0,.09);transition:transform .12s,filter .18s;
  }
  .start:hover{filter:brightness(1.05)}
  .start:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.09)}
  .note{font-size:12.5px;color:var(--faint);margin-top:16px;line-height:1.8}

  /* ── 設問 ── */
  .quiz{padding-block:26px 50px}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
  .dot.on{background:var(--accent)}
  .dot.now{background:var(--accent);transform:scale(1.55)}
  .count{text-align:center;font-size:13px;color:var(--faint);margin:0 0 16px;font-weight:500}
  .qcard{
    background:var(--card);border-radius:var(--r);padding:26px 22px;
    box-shadow:var(--shadow);margin-bottom:16px;
  }
  .q{font-weight:700;font-size:clamp(18px,4.9vw,21px);line-height:1.75;margin:0;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    width:100%;text-align:left;padding:16px 18px;
    background:var(--card);color:var(--text);
    border:2px solid var(--line);border-radius:18px;
    line-height:1.7;font-size:15px;font-weight:500;
    transition:border-color .16s,background .16s,transform .1s;
  }
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt:active{transform:scale(.985)}
  .back{
    display:block;margin:20px auto 0;background:none;border:0;
    color:var(--faint);font-size:13.5px;padding:8px 14px;font-weight:500;
  }

  /* ── 結果 ── */
  .result{padding-block:30px 56px}
  .rhead{
    background:var(--card);border-radius:var(--r);padding:28px 22px 26px;
    text-align:center;box-shadow:var(--shadow);margin-bottom:26px;
    border-top:7px solid var(--accent);
  }
  .rimg{
    width:min(230px,58vw);aspect-ratio:1/1;margin:0 auto 14px;
    border-radius:50%;overflow:hidden;background:var(--soft);
  }
  .rimg img{width:100%;height:100%;object-fit:cover;display:block}
  .animal{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:12.5px;letter-spacing:.06em;
    padding:6px 15px;border-radius:999px;margin:0 0 12px;
  }
  .rname{font-weight:700;font-size:clamp(24px,6.4vw,30px);line-height:1.45;margin:0 0 10px;color:var(--accent)}
  .rcatch{font-size:15.5px;color:var(--dim);margin:0;line-height:1.8}

  .axes{display:flex;flex-direction:column;gap:14px;background:var(--card);
    border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:30px}
  .axis{display:grid;grid-template-columns:3.6em 1fr 3.6em;align-items:center;gap:10px;font-size:12.5px;font-weight:500}
  .axis span{color:var(--faint)}
  .axis span.hit{color:var(--accent);font-weight:700}
  .axis span:last-child{text-align:right}
  .track{height:9px;background:var(--soft);border-radius:999px;position:relative}
  .fill{position:absolute;top:0;height:9px;background:var(--accent);border-radius:999px}

  section{margin-bottom:26px;background:var(--card);border-radius:var(--r);
    padding:24px 22px;box-shadow:var(--shadow)}
  h2{font-weight:700;font-size:17.5px;margin:0 0 16px;display:flex;align-items:center;gap:9px}
  h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .scenes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  .scenes li{background:var(--soft);border-radius:15px;padding:14px 16px;font-size:14.5px;line-height:1.8;color:var(--text)}
  .loop{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .loop li{background:var(--soft);border-radius:999px;padding:11px 18px;font-size:14px;color:var(--text);position:relative}
  .loop li+li{margin-top:16px}
  .loop li+li::before{
    content:"";position:absolute;left:50%;top:-14px;width:2px;height:12px;
    background:var(--line);border-radius:2px;
  }
  .pair{display:flex;flex-direction:column;gap:14px}
  .pbox{border-radius:18px;padding:17px 18px}
  .pbox.good{background:#E8F8F2}
  .pbox.hard{background:#FFEFF2}
  :root:not([data-theme="light"]) .pbox.good,:root[data-theme="dark"] .pbox.good{background:#243A34}
  :root:not([data-theme="light"]) .pbox.hard,:root[data-theme="dark"] .pbox.hard{background:#3E2831}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .pbox.good{background:#E8F8F2}
    :root:not([data-theme="dark"]) .pbox.hard{background:#FFEFF2}}
  .pbox h3{margin:0 0 9px;font-size:13.5px;font-weight:700}
  .pbox.good h3{color:#2E9C7C}
  .pbox.hard h3{color:#E05C7A}
  .pbox p{margin:0;font-size:14px;color:var(--text);line-height:1.9}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:13px}
  .steps li{counter-increment:s;padding-left:38px;position:relative;font-size:14.5px;line-height:1.8}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:2px;
    width:25px;height:25px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .tonight{background:var(--accent-soft);box-shadow:none;border:2px dashed var(--accent)}
  .tonight h2{color:var(--accent)}
  .tonight p{margin:0;font-size:15.5px;line-height:1.9}

  .cta{background:var(--card);box-shadow:var(--shadow);text-align:center}
  .cta .pr{font-size:11.5px;color:var(--faint);margin:0 0 10px;font-weight:500}
  .cta h2{justify-content:center;font-size:18px}
  .cta p{font-size:14.5px;color:var(--dim);margin:0 0 20px;text-align:left}
  .cta a{
    display:block;padding:17px;border-radius:999px;background:var(--accent);
    color:#fff;text-decoration:none;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.09);
  }
  .cta a:hover{filter:brightness(1.05)}
  .cta a.sub{
    background:transparent;color:var(--dim);box-shadow:none;border:1.5px solid var(--line);
    font-weight:500;font-size:13.5px;padding:13px;margin-top:12px;
  }
  .cta a.sub:hover{background:var(--soft);filter:none}
  .cta p b{color:var(--text);font-weight:700}
  .ctanote{font-size:11.5px!important;color:var(--faint)!important;margin:14px 0 0!important;text-align:center!important;line-height:1.75}
  .cta .sublead{font-size:12.5px!important;color:var(--faint)!important;margin:22px 0 0!important;text-align:center!important}

  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .ghost{
    flex:1;min-width:145px;padding:15px;border-radius:999px;
    background:var(--card);border:2px solid var(--line);color:var(--dim);
    font-size:14px;font-weight:700;
  }
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .disc{font-size:11.5px;color:var(--faint);line-height:1.85;margin-top:26px;text-align:left}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <div id="intro" class="intro">
    <div class="hero"><img src="a17.jpg" alt="両手を振ってむかえてくれるねこ" loading="eager"></div>
    <p class="pill">16タイプ・ぜんぶで10問</p>
    <h1>こじらせ16タイプ診断</h1>
    <p class="lede">
      恋愛や人間関係で、<b>いつも同じところで苦しくなる</b>。<br>
      その「同じところ」に、名前をつけます。<br><br>
      性格を決めつけるためのものではありません。自分がはまりやすい流れを先に知っておくと、次に同じ夜が来たときに、少しだけ扱いやすくなります。
    </p>
    <div class="chips">
      <span class="chip">設問 <b>10問</b></span>
      <span class="chip">所要 <b>約3分</b></span>
      <span class="chip">登録 <b>不要</b></span>
    </div>
    <button class="start" id="go">診断をはじめる</button>
    <p class="note">選ぶだけです。文章を書く必要はありません。<br>途中で閉じても、同じ端末なら続きから再開できます。</p>
    <p class="note" style="color:var(--faint)">※このページには広告（PR）が含まれます。</p>
  </div>

  <div id="quiz" class="quiz" hidden>
    <div class="dots" id="dots"></div>
    <p class="count" id="count"></p>
    <div class="qcard"><h2 class="q" id="qtext"></h2></div>
    <div class="opts" id="opts"></div>
    <button class="back" id="back" hidden>← ひとつ戻る</button>
  </div>

  <div id="result" class="result" hidden></div>

</div>

<script>
/* 軸  A:近づく/待つ  B:考える/感じる  C:抱える/手放す  D:合わせる/守る */
var Q = [
 {t:"親しい相手から返信が来ない夜。頭に最初に浮かぶのは？",
  o:[["何かあったのかなと、こちらから連絡してみる",{A:2}],
     ["嫌われたのかもしれないと、会話を思い返す",{B:2,C:1}],
     ["忙しいんだろうと思い、自分の時間に戻る",{A:-2,C:-1}],
     ["こちらからは送らず、相手の出方を待つ",{A:-2,D:1}]]},
 {t:"相手の機嫌が悪そうなとき、あなたはどうしますか？",
  o:[["どうしたのかを聞いて、なんとかしようとする",{A:2,D:2}],
     ["自分が何かしたのかを、まず考える",{B:2,D:2}],
     ["落ち着くまで、そっとしておく",{A:-1,D:-2}],
     ["気にしていないふりをするが、内心ずっと引きずる",{C:2,D:-1}]]},
 {t:"本当は断りたい頼みごとをされました。",
  o:[["その場で理由を言って断る",{D:-2,A:1}],
     ["がっかりされたくなくて、引き受けてしまう",{D:2}],
     ["返事を保留にして、期限が来たら結局引き受ける",{D:2,A:-1}],
     ["断るけれど、そのあと罪悪感が残る",{D:-1,C:1,B:1}]]},
 {t:"好きな人との距離を縮めたいとき。",
  o:[["自分から誘って、好意も言葉にする",{A:2}],
     ["反応を細かく見ながら、少しずつ近づく",{A:1,B:2}],
     ["相手から来てくれるのを待つ",{A:-2}],
     ["好きになるほど慎重になって、逆に引いてしまう",{A:-2,D:-2}]]},
 {t:"誰かに傷つけられたあと、どう回復しますか？",
  o:[["誰かに話を聞いてもらって、整理する",{A:2,D:1}],
     ["やり取りを何度も思い返して、自分なりの答えを探す",{B:2,C:2}],
     ["ひとりで距離を置いて、時間が経つのを待つ",{A:-1,D:-2}],
     ["平気なふりをするが、長く心に残る",{C:2,D:-1}]]},
 {t:"眠れない夜、頭の中にあるのは。",
  o:[["今日の会話。嫌われていないかを確かめている",{B:1,C:2}],
     ["言えなかった一言。言っていたらどうなっていたか",{B:2,C:2,A:-1}],
     ["これからのこと。まだ終わっていない用事",{B:2,C:-2}],
     ["特に何も。ただ、気持ちが落ち着かない",{B:-2}]]},
 {t:"感情が動いたとき、あなたに起きやすいのは。",
  o:[["まず言葉にして、相手に伝えようとする",{A:2,B:-1}],
     ["声が震えたり、言葉より先に涙が出たりする",{B:-2}],
     ["いったん持ち帰って、落ち着いてから考える",{B:2,A:-1}],
     ["表情には出さないが、あとから一気に来る",{B:1,C:2,D:-1}]]},
 {t:"終わった関係を、どう引きずりますか？",
  o:[["連絡先や写真を消せないまま、置いてある",{C:2}],
     ["「あのとき別の言い方をしていれば」と何度も戻る",{C:2,B:2}],
     ["大切な経験として整理して、前に進む",{C:-2}],
     ["考えないようにして、新しい予定で埋める",{C:-2,B:-1}]]},
 {t:"自分の予定や体調を後回しにするのは、どんなとき？",
  o:[["相手が困っているとき",{D:2,A:1}],
     ["場がうまく進みそうなとき",{D:2,B:1}],
     ["期待に応えたい、失望させたくないとき",{D:2,C:1}],
     ["後回しにはしない。自分の線は引いている",{D:-2}]]},
 {t:"「大事にされている」と感じるのは、どんな瞬間ですか？",
  o:[["こまめに連絡をくれるとき",{A:1,C:1}],
     ["言わなくても察してくれたとき",{A:-2,B:-1}],
     ["こちらの考えを、否定せずに聞いてくれたとき",{B:2,D:-1}],
     ["ひとりの時間を、そっとしておいてくれるとき",{D:-2,A:-1}]]}
];

/* [名前, キャッチ, 画像, 動物, alt, 主色, 淡色(明), 淡色(暗)] */
var TYPES = {
 "近考抱合":["先回りして埋める人","尽くして、確かめて、また尽くす。","a01.jpg","ゴールデンレトリバー","荷物をたくさん抱えたいぬ","#E8A317","#FDF0D5","#4A3A14"],
 "近考抱守":["答えを探し続ける人","理由がわかるまで、終われない。","a02.jpg","フクロウ","虫めがねを覗きこむふくろう","#8B72C4","#EFE9FA","#362C55"],
 "近考放合":["整理してから渡す人","わかってしまえば、前に進める。","a03.jpg","うさぎ","リボンの箱を差し出すうさぎ","#6BA88A","#E7F4EC","#22382C"],
 "近考放守":["線を引いて近づく人","近づくけれど、飲み込まれない。","a04.jpg","ねこ","線を引きながら手を振るねこ","#4A9BA8","#E2F2F5","#1B3A40"],
 "近感抱合":["全部あげてしまう人","好きになるほど、自分が減っていく。","a05.jpg","ひつじ","花束の後ろに隠れるひつじ","#E77F94","#FCE7EB","#472730"],
 "近感抱守":["熱を抱えたまま待てない人","伝えてから、後悔する。","a06.jpg","りす","ハートを抱えて走るりす","#DD6B3C","#FBE8DF","#472518"],
 "近感放合":["その時を生きる人","終わった恋を、きれいに置いていける。","a07.jpg","かわうそ","風船を持ってスキップするかわうそ","#E8973F","#FCEEDC","#46301A"],
 "近感放守":["まっすぐ渡して手を離す人","好きと言えて、引き際も知っている。","a08.jpg","ことり","小鳥を空へ逃がすとり","#5AA8DC","#E4F1FB","#1D3448"],
 "待考抱合":["察して動けなくなる人","気づいているのに、言えない。","a09.jpg","ハムスター","口をおさえるハムスター","#C98499","#F8EAEF","#412A33"],
 "待考抱守":["ひとりで結論を出す人","誰にも聞かずに、抱えて終わる。","a10.jpg","ハリネズミ","毛布にくるまるハリネズミ","#8E6BA6","#F0E8F6","#33253C"],
 "待考放合":["静かに合わせて、静かに離れる人","波風を立てずに、終わらせる。","a11.jpg","あざらし","一歩下がって笑うあざらし","#5FBFA0","#E3F6EF","#1C3C33"],
 "待考放守":["距離で自分を守る人","近づきすぎる前に、引く。","a12.jpg","かめ","甲羅から顔を出すかめ","#6F9B5E","#EAF3E4","#26331F"],
 "待感抱合":["言えないまま数える人","返事を待つ夜が、いちばん長い。","a13.jpg","こぐま","大きなスマホを抱えるこぐま","#A5764F","#F5EADF","#3B2A1B"],
 "待感抱守":["心の中だけで愛する人","誰にも見せずに、ずっと持っている。","a14.jpg","こじか","小さなハートを胸に包むこじか","#C79A6B","#F8EEE1","#3E3022"],

function dots(){
  var h="";

}
function render(){
  if(idx>=Q.length){show();return}

  el("qtext").textContent=Q[idx].t;
  var box=el("opts"); box.innerHTML="";
  Q[idx].o.forEach(function(o,i){
    var b=document.createElement("button");
    b.className="opt"; b.type="button"; b.textContent=o[0];
    b.onclick=function(){pick(i)};
    box.appendChild(b);
  });
  el("back").hidden = idx===0;
  save();
}
function pick(i){
  var w=Q[idx].o[i][1];
  hist.push(JSON.parse(JSON.stringify(S)));
  for(var k in w) S[k]+=w[k];
  idx++; render();
  window.scrollTo({top:0,behavior:"smooth"});
}
el("back").onclick=function(){ if(!hist.length)return; S=hist.pop(); idx--; render(); };
function pole(v,hi,lo){return v>=0?hi:lo}

     steps.map(function(s){return "<li>"+s+"</li>"}).join("")+'</ul></section>'+

     'そして<b>体のほうは、削られたぶんを戻す作業が別に要ります。</b></p>'+
   '</section>'+
