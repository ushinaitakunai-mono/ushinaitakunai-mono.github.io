<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="恋愛や人間関係で、いつも同じところで苦しくなる。その「同じところ」に名前をつける10問3分の診断。">
<meta property="og:title" content="こじらせ16タイプ診断">
<meta property="og:description" content="いつも同じところで苦しくなる理由に、名前をつけます。10問・3分・登録不要。">
<meta property="og:type" content="website">
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>こじらせ16タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FFF7F0;
    --card:#FFFFFF;
    --soft:#FFF0E6;
    --line:#F2E2D5;
    --text:#3B3340;
    --dim:#7C7085;
    --faint:#A99CB0;

    /* 4グループの色 */
    --g-hold-give:#FF8BA0;   /* 抱×合 コーラル */
    --g-hold-keep:#A78BFA;   /* 抱×守 パープル */
    --g-free-give:#4FCBA4;   /* 放×合 ミント   */
    --g-free-keep:#5BB3F0;   /* 放×守 スカイ   */
    --accent:var(--g-hold-give);
    --accent-soft:#FFE6EB;

    --r:22px;
    --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
    --shadow:0 2px 0 rgba(59,51,64,.06), 0 10px 24px -14px rgba(59,51,64,.28);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#221C26;--card:#2E2632;--soft:#372D3C;--line:#443A49;
      --text:#F6EFF3;--dim:#C3B4C8;--faint:#9A8CA0;--accent-soft:#4A2E3A;
      --shadow:0 2px 0 rgba(0,0,0,.2), 0 10px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#221C26;--card:#2E2632;--soft:#372D3C;--line:#443A49;
    --text:#F6EFF3;--dim:#C3B4C8;--faint:#9A8CA0;--accent-soft:#4A2E3A;
    --shadow:0 2px 0 rgba(0,0,0,.2), 0 10px 24px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:16px;line-height:1.9;
    -webkit-font-smoothing:antialiased;
    padding-inline:18px;padding-block:0;
  }
  .wrap{max-width:540px;margin:0 auto}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .start:focus-visible,.opt:focus-visible,.ghost:focus-visible,.back:focus-visible{
    outline:3px solid var(--g-free-keep);outline-offset:3px;
  }

  /* ── 導入 ── */
  .intro{padding-block:34px 44px;text-align:center}
  .hero{
    width:min(240px,62vw);aspect-ratio:1/1;margin:0 auto 6px;
    border-radius:50%;background:var(--soft);overflow:hidden;
  }
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .pill{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:12px;letter-spacing:.08em;
    padding:6px 14px;border-radius:999px;margin-bottom:14px;
  }
  h1{
    font-weight:700;font-size:clamp(27px,7.4vw,35px);line-height:1.5;
    margin:0 0 18px;text-wrap:balance;
  }
  .lede{
    font-size:15px;color:var(--dim);margin:0 auto 26px;
    max-width:23em;text-align:left;
  }
  .lede b{color:var(--text);font-weight:700}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .chip{
    background:var(--card);border:2px solid var(--line);border-radius:999px;
    padding:7px 15px;font-size:13px;color:var(--dim);font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--text);font-weight:700}
  .start{
    display:block;width:100%;padding:19px;border:0;border-radius:999px;
    background:var(--accent);color:#fff;font-weight:700;font-size:17px;
    box-shadow:0 4px 0 rgba(0,0,0,.09);transition:transform .12s,filter .18s;
  }
  .start:hover{filter:brightness(1.05)}
  .start:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.09)}
  .note{font-size:12.5px;color:var(--faint);margin-top:16px;line-height:1.8}

  /* ── 設問 ── */
  .quiz{padding-block:26px 50px}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
  .dot.on{background:var(--accent)}
  .dot.now{background:var(--accent);transform:scale(1.55)}
  .count{text-align:center;font-size:13px;color:var(--faint);margin:0 0 16px;font-weight:500}
  .qcard{
    background:var(--card);border-radius:var(--r);padding:26px 22px;
    box-shadow:var(--shadow);margin-bottom:16px;
  }
  .q{font-weight:700;font-size:clamp(18px,4.9vw,21px);line-height:1.75;margin:0;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    width:100%;text-align:left;padding:16px 18px;
    background:var(--card);color:var(--text);
    border:2px solid var(--line);border-radius:18px;
    line-height:1.7;font-size:15px;font-weight:500;
    transition:border-color .16s,background .16s,transform .1s;
  }
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt:active{transform:scale(.985)}
  .back{
    display:block;margin:20px auto 0;background:none;border:0;
    color:var(--faint);font-size:13.5px;padding:8px 14px;font-weight:500;
  }

  /* ── 結果 ── */
  .result{padding-block:30px 56px}
  .rhead{
    background:var(--card);border-radius:var(--r);padding:28px 22px 26px;
    text-align:center;box-shadow:var(--shadow);margin-bottom:26px;
    border-top:7px solid var(--accent);
  }
  .rimg{
    width:min(230px,58vw);aspect-ratio:1/1;margin:0 auto 14px;
    border-radius:50%;overflow:hidden;background:var(--soft);
  }
  .rimg img{width:100%;height:100%;object-fit:cover;display:block}
  .animal{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:12.5px;letter-spacing:.06em;
    padding:6px 15px;border-radius:999px;margin:0 0 12px;
  }
  .rname{font-weight:700;font-size:clamp(24px,6.4vw,30px);line-height:1.45;margin:0 0 10px;color:var(--accent)}
  .rcatch{font-size:15.5px;color:var(--dim);margin:0;line-height:1.8}

  .axes{display:flex;flex-direction:column;gap:22px;background:var(--card);
    border-radius:var(--r);padding:24px 22px;box-shadow:var(--shadow);margin-bottom:30px}
  .axis .cap{font-size:12px;color:var(--faint);margin:0 0 7px;font-weight:500}
  .axrow{display:grid;grid-template-columns:5.4em 1fr 5.4em;align-items:center;gap:10px}
  .axrow .p{font-size:12.5px;line-height:1.45;color:var(--faint);font-weight:500}
  .axrow .p b{display:block;font-size:16px;font-weight:700;line-height:1.3}
  .axrow .p.hit{color:var(--accent)}
  .axrow .p:last-child{text-align:right}
  .track{height:9px;background:var(--soft);border-radius:999px;position:relative}
  .fill{position:absolute;top:0;height:9px;background:var(--accent);border-radius:999px}
  .axpct{font-size:11.5px;color:var(--faint);text-align:center;margin:6px 0 0;font-weight:500}

  /* ── 追加セクション ── */
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
  .tag{background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;
    padding:7px 13px;border-radius:999px}
  .strs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .strs li{position:relative;padding-left:27px;font-size:14.5px;line-height:1.8}
  .strs li::before{content:"";position:absolute;left:2px;top:.62em;width:11px;height:11px;
    border-radius:50%;border:3px solid var(--accent)}
  .mis{background:var(--soft);border-radius:15px;padding:15px 17px;font-size:14px;
    line-height:1.9;margin:16px 0 0;color:var(--text)}
  .mis b{color:var(--accent)}
  .match{display:flex;flex-direction:column;gap:12px}
  .mrow{display:grid;grid-template-columns:58px 1fr;gap:13px;align-items:start;
    background:var(--soft);border-radius:15px;padding:14px 16px}
  .mav{position:relative;width:58px}
  .mav img{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block;background:var(--card)}
  .mk{position:absolute;right:-5px;bottom:-4px;width:24px;height:24px;border-radius:50%;
    background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18);
    font-size:14px;font-weight:700;line-height:24px;text-align:center}
  .mk.g{color:#2E9C7C} .mk.b{color:#E05C7A}
  .mn{font-weight:700;font-size:14.5px;margin:0 0 5px;line-height:1.5}
  .mnn{display:block;font-size:12.5px;font-weight:500;color:var(--faint)}
  .mw{margin:0;font-size:13.5px;line-height:1.85;color:var(--dim)}
  .wants{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .wants li{background:var(--accent-soft);border-radius:16px 16px 16px 5px;padding:14px 17px;
    font-size:15px;line-height:1.7;color:var(--text);font-weight:500}
  .endp{margin:0;font-size:14.5px;line-height:1.95}
  .secbody{margin:0;font-size:14.5px;line-height:1.95;white-space:pre-line}

  section{margin-bottom:26px;background:var(--card);border-radius:var(--r);
    padding:24px 22px;box-shadow:var(--shadow)}
  h2{font-weight:700;font-size:17.5px;margin:0 0 16px;display:flex;align-items:center;gap:9px}
  h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .scenes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  .scenes li{background:var(--soft);border-radius:15px;padding:14px 16px;font-size:14.5px;line-height:1.8;color:var(--text)}
  .loop{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .loop li{background:var(--soft);border-radius:999px;padding:11px 18px;font-size:14px;color:var(--text);position:relative}
  .loop li+li{margin-top:16px}
  .loop li+li::before{
    content:"";position:absolute;left:50%;top:-14px;width:2px;height:12px;
    background:var(--line);border-radius:2px;
  }
  .pair{display:flex;flex-direction:column;gap:14px}
  .pbox{border-radius:18px;padding:17px 18px}
  .pbox.good{background:#E8F8F2}
  .pbox.hard{background:#FFEFF2}
  :root:not([data-theme="light"]) .pbox.good,:root[data-theme="dark"] .pbox.good{background:#243A34}
  :root:not([data-theme="light"]) .pbox.hard,:root[data-theme="dark"] .pbox.hard{background:#3E2831}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .pbox.good{background:#E8F8F2}
    :root:not([data-theme="dark"]) .pbox.hard{background:#FFEFF2}}
  .pbox h3{margin:0 0 9px;font-size:13.5px;font-weight:700}
  .pbox.good h3{color:#2E9C7C}
  .pbox.hard h3{color:#E05C7A}
  .pbox p{margin:0;font-size:14px;color:var(--text);line-height:1.9}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:13px}
  .steps li{counter-increment:s;padding-left:38px;position:relative;font-size:14.5px;line-height:1.8}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:2px;
    width:25px;height:25px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .tonight{background:var(--accent-soft);box-shadow:none;border:2px dashed var(--accent)}
  .tonight h2{color:var(--accent)}
  .tonight p{margin:0;font-size:15.5px;line-height:1.9}

  .cta{background:var(--card);box-shadow:var(--shadow);text-align:center}
  .cta .pr{font-size:11.5px;color:var(--faint);margin:0 0 10px;font-weight:500}
  .cta h2{justify-content:center;font-size:18px}
  .cta p{font-size:14.5px;color:var(--dim);margin:0 0 20px;text-align:left}
  .cta a{
    display:block;padding:17px;border-radius:999px;background:var(--accent);
    color:#fff;text-decoration:none;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.09);
  }
  .cta a:hover{filter:brightness(1.05)}
  .cta a.sub{
    background:transparent;color:var(--dim);box-shadow:none;border:1.5px solid var(--line);
    font-weight:500;font-size:13.5px;padding:13px;margin-top:12px;
  }
  .cta a.sub:hover{background:var(--soft);filter:none}
  .cta p b{color:var(--text);font-weight:700}
  .ctanote{font-size:11.5px!important;color:var(--faint)!important;margin:14px 0 0!important;text-align:center!important;line-height:1.75}
  .cta .sublead{font-size:12.5px!important;color:var(--faint)!important;margin:22px 0 0!important;text-align:center!important}

  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .ghost{
    flex:1;min-width:145px;padding:15px;border-radius:999px;
    background:var(--card);border:2px solid var(--line);color:var(--dim);
    font-size:14px;font-weight:700;
  }
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .disc{font-size:11.5px;color:var(--faint);line-height:1.85;margin-top:26px;text-align:left}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <div id="intro" class="intro">
    <div class="hero"><img src="a17.jpg" alt="両手を振ってむかえてくれるねこ" loading="eager"></div>
    <p class="pill">16タイプ・ぜんぶで10問</p>
    <h1>こじらせ16タイプ診断</h1>
    <p class="lede">
      恋愛や人間関係で、<b>いつも同じところで苦しくなる</b>。<br>
      その「同じところ」に、名前をつけます。<br><br>
      性格を決めつけるためのものではありません。自分がはまりやすい流れを先に知っておくと、次に同じ夜が来たときに、少しだけ扱いやすくなります。
    </p>
    <div class="chips">
      <span class="chip">設問 <b>10問</b></span>
      <span class="chip">所要 <b>約3分</b></span>
      <span class="chip">登録 <b>不要</b></span>
    </div>
    <button class="start" id="go">診断をはじめる</button>
    <p class="note">選ぶだけです。文章を書く必要はありません。<br>途中で閉じても、同じ端末なら続きから再開できます。</p>
    <p class="note" style="color:var(--faint)">※このページには広告（PR）が含まれます。</p>
  </div>

  <div id="quiz" class="quiz" hidden>
    <div class="dots" id="dots"></div>
    <p class="count" id="count"></p>
    <div class="qcard"><h2 class="q" id="qtext"></h2></div>
    <div class="opts" id="opts"></div>
    <button class="back" id="back" hidden>← ひとつ戻る</button>
  </div>

  <div id="result" class="result" hidden></div>

</div>

<script src="types.js"></script>
<script>

     ["ひとりで距離を置いて、時間が経つのを待つ",{A:-1,D:-2}],

     ["「あのとき別の言い方をしていれば」と何度も戻る",{C:2,B:2}],
     ["大切な経験として整理して、前に進む",{C:-2}],
     ["考えないようにして、新しい予定で埋める",{C:-2,B:-1}]]},
 {t:"自分の予定や体調を後回しにするのは、どんなとき？",

 {t:"「大事にされている」と感じるのは、どんな瞬間ですか？",

   旧版はここに TYPES/SCENE/LOOP/FIT/HARD/STEP/TONIGHT/DRAIN を置き、
   軸ごとの部品を組み合わせて16通りに見せていたが、
   1文字違いのタイプ同士で本文の7〜8割が同じ文になっていたため廃止。
   設計根拠: リサーチ/診断結果ページ分解_20260922.md */

/* A8 直リンク（2026-09-22 lit.link経由を廃止）
   ⚠️ A8規約: 登録していないサイトへの広告掲載は禁止。成果が全否認され、提携解除の対象になる。
   このページのドメインを必ずA8にサイト登録してから公開すること。
   登録状況は offers/診断ページ公開_20260922.md を参照。 */
/* ⚠️ 2番目のセグメント（4BE6FU / C3TCD6）が「サイトID 002＝こじらせ16タイプ診断」を表す。
   TikTokサイト(001)用のリンク（4BE5O2 / C3TBLE）をここに貼ると計上先が違うので使わない。 */
var A8_BEAUTY  = "https://px.a8.net/svt/ejp?a8mat=4BCGFJ+4BE6FU+1USQ+3H18R6"; /* オルビスユー ドット 素材001「初回限定980円」クリック率5%以上・報酬1,800円・EPC707・確定率98.75% */
var A8_URANAI  = "https://px.a8.net/svt/ejp?a8mat=4B7WD2+C3TCD6+2PEO+C3BAQ";  /* ココナラ電話占い 素材031「3,000円無料クーポン」報酬16,000円・EPC68.88 ※絶対ルール5（740クリックまで判定しない）のため残す */
var S={A:0,B:0,C:0,D:0}, idx=0, hist=[];
var el=function(id){return document.getElementById(id)};
var KEY="kojirase_v2";

function save(){try{localStorage.setItem(KEY,JSON.stringify({S:S,idx:idx,hist:hist}))}catch(e){}}
function load(){try{var d=localStorage.getItem(KEY);return d?JSON.parse(d):null}catch(e){return null}}
function clear(){try{localStorage.removeItem(KEY)}catch(e){}}

function dots(){
  var h="";
  for(var i=0;i<Q.length;i++){
    var c="dot"+(i<idx?" on":"")+(i===idx?" now":"");
    h+='<div class="'+c+'"></div>';
  }
  el("dots").innerHTML=h;
}
function render(){
  if(idx>=Q.length){show();return}
  dots();
  el("count").textContent=(idx+1)+" / "+Q.length;
  el("qtext").textContent=Q[idx].t;
  var box=el("opts"); box.innerHTML="";
  Q[idx].o.forEach(function(o,i){
    var b=document.createElement("button");
    b.className="opt"; b.type="button"; b.textContent=o[0];
    b.onclick=function(){pick(i)};
    box.appendChild(b);
  });
  el("back").hidden = idx===0;
  save();
}
function pick(i){
  var w=Q[idx].o[i][1];
  hist.push(JSON.parse(JSON.stringify(S)));
  for(var k in w) S[k]+=w[k];
  idx++; render();
  window.scrollTo({top:0,behavior:"smooth"});
}
el("back").onclick=function(){ if(!hist.length)return; S=hist.pop(); idx--; render(); };
function pole(v,hi,lo){return v>=0?hi:lo}

function show(){
  el("quiz").hidden=true;
  var a=pole(S.A,"近","待"), b=pole(S.B,"考","感"),
      c=pole(S.C,"抱","放"), d=pole(S.D,"合","守");
  var code=a+b+c+d, t=T[code];

  var dark=false;
  try{
    var th=document.documentElement.getAttribute("data-theme");
    dark = th==="dark" || (th!=="light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }catch(e){}
  var root=document.documentElement;
  root.style.setProperty("--accent", t.col[0]);
  root.style.setProperty("--accent-soft", dark?t.col[2]:t.col[1]);

  var order=[[Math.abs(S.A),a],[Math.abs(S.B),b],[Math.abs(S.C),c],[Math.abs(S.D),d]]
            .sort(function(x,y){return y[0]-x[0]});
  var scenes=t.sc;

  /* 軸の表示。文字だけでは分からないので、日本語名と「何を測っているか」を出す。
     どちら寄りかを％でも見せる（16Personalities方式）。 */
  function axrow(ax,val,picked){
    var lean = Math.min(100, Math.round(50 + (val/14)*50));
    var hiSide = val>=0;
    var pct = hiSide ? lean : 100-lean;
    var side = hiSide ? ax.hi : ax.lo;
    var fillL = hiSide ? 50 : Math.max(4,lean);
    var fillW = Math.abs(lean-50);
    return '<div class="axis">'+
      '<p class="cap">'+ax.label+'</p>'+
      '<div class="axrow">'+
        '<span class="p'+(picked===ax.lo[0]?" hit":"")+'"><b>'+ax.lo[0]+'</b>'+ax.lo[1]+'</span>'+
        '<div class="track"><div class="fill" style="left:'+fillL+'%;width:'+fillW+'%"></div></div>'+
        '<span class="p'+(picked===ax.hi[0]?" hit":"")+'"><b>'+ax.hi[0]+'</b>'+ax.hi[1]+'</span>'+
      '</div>'+
      '<p class="axpct">'+(Math.max(50,pct)<=52
         ? "どちらも半分ずつ"
         : side[1]+'寄り '+Math.max(50,pct)+'%')+'</p>'+
    '</div>';
  }
  /* 動物名 → 画像・タイプ名。相性欄に相手のキャラを出すために引く。 */
  var BY_ANIMAL={};
  for(var k in T){ if(T.hasOwnProperty(k)) BY_ANIMAL[T[k].an]=T[k]; }
  function mrow(m,good){
    var o=BY_ANIMAL[m[0]], why=m[2];
    /* 説明文の冒頭がタイプ名の繰り返しになるので落とす（名前は上に出ている） */
    if(o && why.indexOf(o.n+"。")===0) why = why.slice(o.n.length+1);
    m=[m[0],m[1],why];
    return '<div class="mrow">'+
      '<div class="mav">'+(o?'<img src="'+o.img+'" alt="'+m[0]+'" loading="lazy">':'')+
        '<span class="mk '+(good?"g":"b")+'">'+m[1]+'</span></div>'+
      '<div><p class="mn">'+m[0]+'タイプ'+(o?'<span class="mnn">'+o.n+'</span>':'')+'</p>'+
      '<p class="mw">'+m[2]+'</p></div></div>';
  }

  var h=''+
   '<div class="rhead">'+
     '<div class="rimg"><img src="'+t.img+'" alt="'+t.alt+'" loading="eager"></div>'+
     '<p class="animal">'+t.an+'タイプ</p>'+
     '<h1 class="rname">'+t.n+'</h1>'+
     '<p class="rcatch">'+t.c+'</p>'+
     '<div class="tagrow">'+t.tags.map(function(x){return '<span class="tag">'+x+'</span>'}).join("")+'</div>'+
   '</div>'+
   '<div class="axes">'+
     axrow(AXES[0],S.A,a)+axrow(AXES[1],S.B,b)+
     axrow(AXES[2],S.C,c)+axrow(AXES[3],S.D,d)+
   '</div>'+
   '<section><h2>'+t.an+'タイプのあなた</h2><p class="secbody">'+t.lead+'</p></section>'+
   t.sec.map(function(s){
     return '<section><h2>'+s[0]+'</h2><p class="secbody">'+s[1]+'</p></section>';
   }).join("")+
   '<section><h2>あなたの強み</h2><ul class="strs">'+
     t.str.map(function(x){return "<li>"+x+"</li>"}).join("")+'</ul>'+
     '<p class="mis">'+t.mis+'</p></section>'+
   '<section><h2>苦しくなりやすい瞬間</h2><ul class="scenes">'+
     scenes.map(function(s){return "<li>"+s+"</li>"}).join("")+'</ul></section>'+
   '<section><h2>'+t.an+'と相性がいいタイプ</h2><div class="match">'+
     t.fit.map(function(m){return mrow(m,true)}).join("")+'</div></section>'+
   '<section><h2>消耗しやすいタイプ</h2><div class="match">'+
     t.hard.map(function(m){return mrow(m,false)}).join("")+'</div></section>'+
   '<section><h2>この関係が終わるとき</h2><p class="endp">'+t.end+'</p></section>'+
   '<section><h2>あなたが本当は言われたい言葉</h2><ul class="wants">'+
     t.want.map(function(x){return "<li>「"+x+"」</li>"}).join("")+'</ul></section>'+
   '<section class="tonight"><h2>今夜できること、ひとつだけ</h2><p>'+t.night+'</p></section>'+
   '<section><h2>'+t.drain[0]+'</h2>'+
     '<p>'+t.drain[1]+'</p>'+
     '<p>心のほうは、上の「今夜できること」から。'+
     'そして<b>体のほうは、削られたぶんを戻す作業が別に要ります。</b></p>'+
   '</section>'+
   '<section class="cta">'+
     '<p class="pr">広告（PR）を含みます</p>'+
     '<h2>疲れが顔に出はじめたら</h2>'+
     '<p>寝不足や気の張りが続いた時期は、肌の調子が落ちて見えることがあります。'+
     '心の整理と同時に、そちらも戻していくほうが早いです。<br><br>'+
     'いきなり大きいものを買う必要はありません。'+
     '<b>7日間ためせるセットが1,000円以下</b>で用意されています。</p>'+
     '<a href="'+A8_BEAUTY+'" target="_blank" rel="noopener nofollow sponsored">7日間のセットを見てみる</a>'+
     '<p class="ctanote">オルビス公式サイト（オルビスユー ドット）が開きます。</p>'+
     '<p class="sublead">どうしても、今夜だれかに聴いてほしいときは</p>'+
     '<a class="sub" href="'+A8_URANAI+'" target="_blank" rel="noopener nofollow sponsored">声で話を聴いてもらう</a>'+
   '</section>'+
   '<div class="tools">'+
     '<button class="ghost" id="copy" type="button">結果をコピー</button>'+
     '<button class="ghost" id="again" type="button">もう一度やる</button>'+
   '</div>'+
   '<p class="disc">この診断は、心理検査でも医療的な診断でもありません。'+
   '性格を断定するものではなく、自分の傾向に名前をつけて扱いやすくするための道具です。'+
   'しんどさが続くときは、専門の窓口に相談してください。</p>';

  var r=el("result"); r.innerHTML=h; r.hidden=false;
  window.scrollTo({top:0,behavior:"smooth"});
  clear();

  el("again").onclick=function(){
    S={A:0,B:0,C:0,D:0}; idx=0; hist=[];
    root.style.removeProperty("--accent"); root.style.removeProperty("--accent-soft");
    r.hidden=true; el("quiz").hidden=false; render(); window.scrollTo({top:0});
  };
  el("copy").onclick=function(){
    /* 共有されることが目的の文面。タイプ名・タグ・相性を入れて、会話が始まる形にする。 */
    var txt="【こじらせ16タイプ診断】\n"+
      "私は "+t.an+"タイプ\n"+
      "「"+t.n+"」\n"+
      t.c+"\n\n"+
      t.tags.join(" ")+"\n\n"+
      "苦しくなりやすい瞬間\n・"+scenes.join("\n・")+"\n\n"+
      "相性がいいのは "+t.fit.map(function(m){return m[0]}).join("・")+"タイプ\n"+
      "消耗しやすいのは "+t.hard.map(function(m){return m[0]}).join("・")+"タイプ\n\n"+
      "あなたは何タイプ？\n"+location.origin+location.pathname;
    var btn=el("copy");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        btn.textContent="コピーしました";
        setTimeout(function(){btn.textContent="結果をコピー"},1800);
      },function(){btn.textContent="コピーできませんでした"});
    } else { btn.textContent="コピーできませんでした"; }
  };
}

el("go").onclick=function(){ el("intro").hidden=true; el("quiz").hidden=false; render(); };

var saved=load();
if(saved&&saved.idx>0&&saved.idx<Q.length){
  S=saved.S; idx=saved.idx; hist=saved.hist||[];
  el("go").textContent="続きから（"+(idx+1)+"問目）";
}
</script>

</body>
</html>
